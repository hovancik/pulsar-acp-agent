name: CI

on:
  push:
    branches: [trunk]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Match Pulsar's runtime: Electron 30.5.1 bundles Node 20.16.0.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: git diff --exit-code lib/main.js lib/main.js.map lib/util.js lib/util.js.map lib/agent-config.js lib/agent-config.js.map
      - run: npm test
